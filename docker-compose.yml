version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask_app
      - fastapi_app
    networks:
      - app-network

  flask_app:
    build: ./flask_app
    container_name: flask_web_app
    expose:
      - "5000"
    environment:
      - DATABASE_URL=postgresql://soil_user:soil_pass@postgres_db:5432/soil_db
      - FASTAPI_URL=http://fastapi_app:8000
    volumes:
      - ./flask_app:/app
    depends_on:
      - postgres_db
    networks:
      - app-network

  fastapi_app:
    build: ./fastapi_app
    container_name: fastapi_api
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://soil_user:soil_pass@postgres_db:5432/soil_db
      - GEE_KEY_PATH=/secrets/gee_service_account.json
    volumes:
      - ./fastapi_app:/app
      - ./secrets/gee_service_account.json:/secrets/gee_service_account.json:ro
    depends_on:
      - postgres_db
    networks:
      - app-network

  postgres_db:
    build: ./db
    container_name: postgres_with_postgis
    environment:
      - POSTGRES_USER=soil_user
      - POSTGRES_PASSWORD=soil_pass
      - POSTGRES_DB=soil_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge